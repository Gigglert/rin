# ── Кейсы ──
cases:
  eyebrow: Кейсы
  title: Задача, решение и результат в цифрах
  intro: >-
    Четыре проекта на разных стадиях: перестройка маркетинга в зрелом регионе, запуск ABM,
    вывод SaaS на новые рынки и поиск первых инвесторов для стартапа.
  all_label: Все
  filters:
    - { id: perf, label: Performance }
    - { id: abm, label: ABM }
    - { id: gtm, label: Выход на рынок }
    - { id: startup, label: Стартап }
  items:
    - category: perf
      color: yellow
      image: ""
      client: Veeam Software · EMEA
      big: "−63%"
      big_label: стоимость лида, Q2 → Q3 2018
      title: Перестройка digital-маркетинга в регионе, который не выполнял план
      steps:
        - { label: Задача, text: "В 2015–2017 годах EMEA выполнял лишь 20–50% квартального плана продаж." }
        - { label: Решение, text: "Перешла с атрибуции по первому клику на мультиканальную, отключила Baidu, Yahoo Japan и Xing, перевела ставки на tCPA и провела 100+ тестов посадочных страниц." }
        - { label: Результат, text: "103% плана продаж и 130% плана по новым лидам, все страны уложились в целевую стоимость результата." }
      metrics:
        - { value: "+193%", label: конверсия }
        - { value: "+28%", label: конверсии }
        - { value: "−52%", label: общие расходы }
      tags: [Google Ads, Атрибуция, A/B-тесты, бюджет ~$1 млн]

    - category: abm
      color: blue
      client: Ecommpay · Платежи
      big: "2×"
      big_label: рост конверсии MQL в SQL за 6 месяцев
      title: Запуск account-based marketing с нуля
      steps:
        - { label: Задача, text: "Воронка теряла лидов, а их качество не устраивало продажи." }
        - { label: Решение, text: "Описала ICP и приоритетные аккаунты, запустила программатик-охват и прогрев, переупаковала продукты по обратной связи от клиентов." }
        - { label: Результат, text: "Конверсия MQL в SQL выросла с 10% до 20%, маркетинг, продукт и продажи работают по общей схеме для ключевых клиентов." }
      metrics:
        - { value: "10 → 20%", label: MQL в SQL }
        - { value: "+60%", label: вовлечённость целевых аккаунтов }
        - { value: 6 мес., label: до результата }
      tags: [ABM, ICP, Email, PPC]

    - category: gtm
      color: green
      client: IT Medical · HealthTech SaaS
      big: 121 MQL
      big_label: за 30 дней из сторонних каналов
      title: Вывод AI-продукта для медицины на рынки США и Великобритании
      steps:
        - { label: Задача, text: "Новый продукт без проверенного позиционирования, сайта и потока лидов." }
        - { label: Решение, text: "Проверила product-market fit, описала ICP и CJM, запустила сайт за 3 месяца и лидогенерацию через Google, LinkedIn, Bing, Reddit, Quora, PR и AI-поиск." }
        - { label: Результат, text: "CPL снизился на 30% за 6 месяцев, платный поиск стал главным источником SQL." }
      metrics:
        - { value: "18%", label: SQL в сделку }
        - { value: "24", label: SQL в квартал из платного поиска }
        - { value: "95%", label: оценка сайта по AEO/GEO }
      tags: [GTM, HubSpot, AEO / GEO, PR]

    - category: startup
      color: pink
      client: Black Aerospace · Космический стартап
      big: "$0"
      big_label: бюджета до раундов pre-seed и seed
      title: Поиск первых клиентов и инвесторов для космического стартапа
      steps:
        - { label: Задача, text: "Компания без готового продукта, маркетингового бюджета и воронки." }
        - { label: Решение, text: "Построила позиционирование и УТП, вела холодные рассылки и работу на отраслевых конференциях, подготовила питч-деки и data room, подала заявки в акселераторы." }
        - { label: Результат, text: "Привлечены инвесторы pre-seed и seed, компания попала в Station F." }
      metrics:
        - { value: "2", label: меморандума с космическими агентствами }
        - { value: "3", label: предварительных контракта }
        - { value: Station F, label: акселератор }
      tags: [Позиционирование, Аутрич, Материалы для инвесторов]

