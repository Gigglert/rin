# ── Кейсы ──
cases:
  eyebrow: Case studies
  title: Problem, approach and result in numbers
  intro: >-
    Four projects from different stages: rebuilding a mature region, launching ABM,
    taking a SaaS to market and finding first investors for a startup.
  all_label: All
  filters:                             # id связывает вкладку с category у кейса
    - { id: perf, label: Performance }
    - { id: abm, label: ABM }
    - { id: gtm, label: Go-to-market }
    - { id: startup, label: Startup }
  items:
    - category: perf
      color: yellow                    # yellow | blue | green | pink
      image: ""                        # обложка кейса, например "/images/cases/veeam.png"
      client: Veeam Software · EMEA
      big: "−63%"
      big_label: cost per lead, Q2 to Q3 2018
      title: Rebuilding digital marketing for a region that missed quota
      steps:
        - { label: Problem, text: "EMEA hit only 20–50% of quarterly quota in 2015–2017." }
        - { label: Approach, text: "Moved from first-click to multi-touch attribution, cut Baidu, Yahoo Japan and Xing, switched to tCPA bidding and ran 100+ landing page tests." }
        - { label: Result, text: "103% of quota and 130% of the net new lead plan, with every country inside cost-per-result benchmarks." }
      metrics:
        - { value: "+193%", label: conversion rate }
        - { value: "+28%", label: conversions }
        - { value: "−52%", label: total spend }
      tags: [Google Ads, Attribution, A/B tests, ~$1M budget]
      # link: { label: Read the full case, href: "https://..." }

    - category: abm
      color: blue
      client: Ecommpay · Payments
      big: "2×"
      big_label: MQL-to-SQL conversion in 6 months
      title: Launching account-based marketing from scratch
      steps:
        - { label: Problem, text: "The funnel leaked and lead quality was too low for sales." }
        - { label: Approach, text: "Defined the ICP and focus accounts, ran programmatic one-to-many outreach and nurturing, and repositioned products from customer feedback." }
        - { label: Result, text: "MQL-to-SQL conversion grew from 10% to 20%; marketing, product and sales shared one account framework." }
      metrics:
        - { value: "10 → 20%", label: MQL-to-SQL }
        - { value: "+60%", label: target account engagement }
        - { value: 6 mo., label: to results }
      tags: [ABM, ICP, Email, PPC]

    - category: gtm
      color: green
      client: IT Medical · HealthTech SaaS
      big: 121 MQLs
      big_label: in 30 days from third-party channels
      title: Taking an AI healthcare SaaS to the US and UK
      steps:
        - { label: Problem, text: "New offer with no validated positioning, website or lead flow." }
        - { label: Approach, text: "Validated product-market fit, built ICP and CJM, launched the site in 3 months and lead gen across Google, LinkedIn, Bing, Reddit, Quora, PR and AI search." }
        - { label: Result, text: "CPL down 30% within 6 months; Paid Search became the top SQL source." }
      metrics:
        - { value: "18%", label: SQL-to-deal }
        - { value: "24", label: SQLs per quarter from paid }
        - { value: "95%", label: AEO/GEO site score }
      tags: [GTM, HubSpot, AEO / GEO, PR]

    - category: startup
      color: pink
      client: Black Aerospace · Space startup
      big: "$0"
      big_label: budget to pre-seed and seed rounds
      title: Finding first clients and investors for a space launch startup
      steps:
        - { label: Problem, text: "Pre-product company with no marketing budget and no pipeline." }
        - { label: Approach, text: "Built positioning and USP, ran cold outreach and space conferences, produced pitch decks and the data room, applied to accelerators." }
        - { label: Result, text: "Pre-seed and seed investors secured; accepted into Station F." }
      metrics:
        - { value: "2", label: MoUs with space agencies }
        - { value: "3", label: preliminary contracts }
        - { value: Station F, label: accelerator }
      tags: [Positioning, Outreach, Investor materials]

