# ─────────────────────────────────────────────────────────────
#  АНГЛИЙСКАЯ ВЕРСИЯ САЙТА (адрес: /)
#  Русская версия лежит рядом: content/ru.yml (адрес: /ru)
#  Как редактировать — см. РЕДАКТИРОВАНИЕ.md в корне репозитория.
#
#  Главные правила YAML:
#   • отступы только пробелами, по 2 на уровень;
#   • новый пункт списка начинается с «- »;
#   • если в тексте есть двоеточие с пробелом «: » или текст
#     начинается с кавычки/скобки, оберните его в "двойные кавычки".
# ─────────────────────────────────────────────────────────────

site:
  name: "[your name]"                 # логотип слева в шапке
  title: "Head of Marketing Portfolio" # название вкладки браузера
  description: "Head of Marketing with 10+ years in B2B tech across US, UK, EU and MENA markets."
  footer_left: "© 2026 [Your Name] · Head of Marketing"
  footer_right: "Remote · US, UK, EU, MENA"

# Порядок секций на странице. Чтобы скрыть секцию — удалите строку,
# чтобы переставить — поменяйте строки местами.
# Доступные: hero, stats, experience, cases, skills, education, looking, contact
order:
  - hero
  - stats
  - experience
  - cases
  - skills
  - education
  - looking
  - contact

# Меню в шапке. href — это «#» + название секции.
nav:
  - { label: Experience, href: "#experience" }
  - { label: Case studies, href: "#cases" }
  - { label: Skills, href: "#skills" }
  - { label: Education, href: "#education" }

header_button: { label: Get in touch, href: "#contact" }

# ── Первый экран ──
hero:
  title: I build B2B marketing from zero
  lead: >-
    Head of Marketing with 10+ years in B2B tech across US, UK, EU and MENA markets.
    Positioning, go-to-market, lead generation and analytics, delivered with an
    AI-native workflow, lean teams and tight budgets.
  buttons:                             # первая кнопка синяя, остальные — текстом
    - { label: See case studies, href: "#cases" }
    - { label: Download résumé (PDF), href: "/resume/Resume_Head_of_Marketing_EN.pdf" }
  card:
    photo: ""                          # например "/images/photo.jpg"; пусто — показываются инициалы
    initials: YN
    name: "[Your Name]"
    subtitle: "Head of Marketing · B2B Tech, HealthTech & FinTech"
    facts:
      - { label: Focus, value: AI-driven growth and go-to-market }
      - { label: Experience, value: 10+ years in B2B tech }
      - { label: Markets, value: "US, UK, EU, MENA" }
      - { label: Format, value: Remote }
      - { label: Languages, value: English C1 · Russian native }
    tags: [B2B SaaS, GTM, ABM, Paid, AEO / GEO, HubSpot]
  badge: { title: "Now: Head of Marketing", text: "OS MENA, Dubai" }   # плашка под карточкой; удалите строку, если не нужна

# ── Цифры и компании ──
stats:
  items:
    - { value: "130%", label: "of the net new lead plan, Veeam EMEA" }
    - { value: "−63%", label: cost per lead after the EMEA rebuild }
    - { value: "2×", label: MQL-to-SQL conversion with ABM at Ecommpay }
    - { value: "+45%", label: qualified inbound leads every six months at Diffco }
  companies:                           # можно добавить logo: "/images/logos/veeam.svg"
    - { name: Veeam }
    - { name: Ecommpay }
    - { name: IT Medical }
    - { name: Diffco }
    - { name: OS MENA }

